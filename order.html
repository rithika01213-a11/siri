<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Your Order</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .order-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <div class="order-container">
    <h2>Product Order Form</h2>
    <form action="/submit-order" method="POST">
      
      <!-- Customer Details -->
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567" required>
      </div>

      <!-- Order Details -->
      <div class="form-group">
        <label for="product">Select Product *</label>
        <select id="product" name="product" required>
          <option value="">-- Choose an item --</option>
          <option value="item1">Standard Package - $25.00</option>
          <option value="item2">Pro Package - $50.00</option>
          <option value="item3">Enterprise Bundle - $100.00</option>
        </select>
      </div>

      <div class="form-group">
        <label for="quantity">Quantity *</label>
        <input type="number" id="quantity" name="quantity" min="1" max="50" value="1" required>
      </div>

      <!-- Shipping Information -->
      <div class="form-group">
        <label for="address">Shipping Address *</label>
        <textarea id="address" name="address" rows="3" placeholder="123 Main St, City, State, ZIP" required></textarea>
      </div>

      <div class="form-group">
        <label for="notes">Order Notes (Optional)</label>
        <textarea id="notes" name="notes" rows="2" placeholder="Delivery instructions or special requests..."></textarea>
      </div>

      <button type="submit">Submit Order</button>
    </form>
  </div>

</body>
</html>
